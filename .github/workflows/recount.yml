name: Recount public proof

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recount:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute selected stored-verdict summary
        run: python3 recount.py
      - name: Verify retained snapshot and summary
        run: python3 verify_snapshot.py
      - name: Refuse corrupted snapshot inputs
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
